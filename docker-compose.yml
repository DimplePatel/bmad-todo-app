# Default compose file. Production-shaped: backend is private, frontend is the
# only public surface, data lives on a named volume. Dev-only conveniences (port
# exposure, NODE_ENV=development) are layered in via docker-compose.override.yml,
# which Compose loads automatically. The "test" profile spins up a one-shot
# Vitest run against the same backend image.

x-common: &common
  restart: unless-stopped
  networks: [todo-net]
  env_file:
    - .env

services:
  backend:
    <<: *common
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: todo-backend:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_PATH: /data/todos.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - todo-db:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    <<: *common
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: todo-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Test profile: runs the backend Vitest suite (unit + integration + persistence)
  # in a container against an ephemeral SQLite file. Activate with:
  #   docker compose --profile test run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    image: todo-backend-test:latest
    networks: [todo-net]
    environment:
      NODE_ENV: test
      DATABASE_PATH: /tmp/test-todos.db
      CI: "true"
    working_dir: /app/backend
    command: ["npx", "vitest", "run", "--reporter=basic"]

volumes:
  todo-db:
    name: todo-db

networks:
  todo-net:
    driver: bridge
    name: todo-net
